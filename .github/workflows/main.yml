name: Application will be containarized
on: 
  workflow_dispatch:
    
jobs:
  deploy:
      runs-on: ubuntu-latest
      steps:
       # 1. Get code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Copy project to EC2
      - name: Copy project to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "./*"
          target: "/tmp/portfolio"

      # 3. Build and deploy on EC2
      - name: Build and deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /tmp/portfolio
            echo "Building Docker image..."

            docker build -t portfolio .
            echo "Starting new container..."
            docker run -d -p 80:80 --name container1 portfolio

       # 4. Verify application and push image from EC2
      - name: Push verified image to Docker Hub
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |

            echo "Logging into Docker Hub..."

            echo "${{ secrets.DOCKER_PWD }}" | \
              docker login -u "${{ vars.DOCKER_USERNAME }}" --password-stdin

            echo "Tagging image..."

            docker tag portfolio:latest ${{ vars.DOCKER_USERNAME }}/portfolio:v1

            docker push ${{ vars.DOCKER_USERNAME }}/portfolio:v1

            echo "Image successfully pushed to Docker Hub!"
            
